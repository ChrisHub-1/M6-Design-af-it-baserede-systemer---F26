<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FindDinFilm</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px);
            padding: 40px 20px;
        }

        .login-box {
            background: #1a4a6e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 2px solid #0077ff;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #efeded;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #bcbcbc;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #0077ff;
            border-radius: 6px;
            background: #0b3252;
            color: #efeded;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00aaff;
            box-shadow: 0 0 5px rgba(0, 170, 255, 0.5);
        }

        .form-group input::placeholder {
            color: #5a7a8c;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .login-button:hover {
            background: #0056b3;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 6px;
            min-height: 20px;
        }

        .toggle-row {
            text-align: center;
            margin-top: 20px;
            color: #bcbcbc;
        }

        .toggle-row button {
            color: #0077ff;
            text-decoration: none;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-row button:hover {
            color: #00aaff;
        }

        @media (max-width: 600px) {
            .login-box {
                padding: 30px 20px;
            }

            .login-box h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <a href="frontpage.html" class="logo">FindDinFilm.dk</a>
            <ul>
                <li><a href="frontpage.html">Forside</a></li>
                <li><a href="login.html" id="loginLink">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <div class="login-box">
            <h2 id="form-title">Log ind</h2>
            <div class="error-message" id="errorMessage"></div>
            <form id="authForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Adgangskode:</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Bekræft adgangskode:</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirm-password" 
                        placeholder="Confirm your password"
                        minlength="6"
                        style="display:none;"
                    >
                </div>

                <button type="submit" class="login-button" id="submit-btn">Log ind</button>
            </form>

            <div class="toggle-row">
                <span id="toggle-text">Har du ikke en konto? </span>
                <button id="toggle-mode" type="button">Opret konto</button>
            </div>
        </div>
    </div>

    <footer>
        <a href="frontpage.html">&copy; 2025 FindDinFilm.dk</a>
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAyh8ecigpscR8gPviU1qQxee5Rp1eeDqs",
            authDomain: "m6-database.firebaseapp.com",
            projectId: "m6-database",
            databaseURL: "https://m6-database.firebaseio.com",
            storageBucket: "m6-database.appspot.com",
            messagingSenderId: "172309206166",
            appId: "1:172309206166:web:c30fcffb805478abce9eb7",
            measurementId: "G-WZ7SVX56XP"
        };

        console.log('Firebase config loaded:', firebaseConfig);

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('Firebase app initialized:', { name: app.name, options: app.options });
        console.log('Firebase auth app config:', auth.app.options);

        const authForm = document.getElementById('authForm');
        const submitBtn = document.getElementById('submit-btn');
        const toggleModeBtn = document.getElementById('toggle-mode');
        const toggleText = document.getElementById('toggle-text');
        const formTitle = document.getElementById('form-title');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const errorMessage = document.getElementById('errorMessage');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        let mode = 'login';

        function setMode(newMode) {
            mode = newMode;
            if (mode === 'signup') {
                formTitle.textContent = 'Opret konto';
                submitBtn.textContent = 'Opret konto';
                toggleText.textContent = 'Har du allerede en konto? ';
                toggleModeBtn.textContent = 'Log ind';
                confirmPasswordInput.style.display = 'block';
                confirmPasswordInput.required = true;
            } else {
                formTitle.textContent = 'Log ind';
                submitBtn.textContent = 'Log ind';
                toggleText.textContent = 'Har du ikke en konto? ';
                toggleModeBtn.textContent = 'Opret konto';
                confirmPasswordInput.style.display = 'none';
                confirmPasswordInput.required = false;
            }
            errorMessage.textContent = '';
        }

        toggleModeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setMode(mode === 'login' ? 'signup' : 'login');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            errorMessage.textContent = '';

            if (mode === 'signup' && password !== confirmPassword) {
                errorMessage.textContent = 'Adgangskoderne matcher ikke.';
                return;
            }

            try {
                let userCredential;

                if (mode === 'signup') {
                    console.log('Creating user with email:', email);
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    console.log('Signing in user with email:', email);
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                }

                const user = userCredential.user;
                console.log('User authenticated:', user.uid);
                
                const userData = {
                    email: user.email,
                    lastLoginAt: serverTimestamp()
                };

                if (mode === 'signup') {
                    userData.createdAt = serverTimestamp();
                }

                console.log('Saving user data to Firestore...');
                await setDoc(doc(db, 'users', user.uid), userData, { merge: true });
                console.log('User data saved successfully');

                // Set local storage for persistence
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('userId', user.uid);

                alert(mode === 'signup' ? 'Konto oprettet!' : 'Login vellykket!');
                // Redirect to frontpage after successful login
                console.log('Redirecting to frontpage...');
                window.location.href = 'frontpage.html';
            } catch (error) {
                console.error('Authentication error:', error.code, error.message);
                if (mode === 'signup') {
                    errorMessage.textContent = 'Oprettelse mislykkedes: ' + error.message;
                } else {
                    errorMessage.textContent = 'Login fejlede: ' + error.message;
                }
            }
        });
    </script>

    <script>
        // Initialize navigation based on login status
        function initializeNavigation() {
            const isLoggedIn = localStorage.getItem('loggedIn') === 'true';

            if (isLoggedIn) {
                // User is logged in - redirect from login page to profile
                window.location.href = 'profilepage.html';
                return;
            }
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', initializeNavigation);
    </script>
</body>
</html>
