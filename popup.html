<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FindDinFilm</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #0b3252;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            background: #104978;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            width: 300px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #efeded;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #240707;
            border-radius: 4px;
            background: #0b3252;
            color: #efeded;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background: #0077ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-container button:hover {
            background: #00aaff;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            color: #efeded;
            font-size: 14px;
        }
        .toggle-row button {
            width: auto;
            padding: 0;
            background: none;
            color: #7fd2ff;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }
        .toggle-row button:hover {
            color: #ccefff;
        }
        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 id="form-title">Log ind</h2>
        <form id="auth-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Adgangskode" required minlength="6">
            <input type="password" id="confirm-password" placeholder="Bekræft adgangskode" minlength="6" style="display:none;">
            <button type="submit" id="submit-btn">Log ind</button>
        </form>
        <div class="toggle-row">
            <span id="toggle-text">Har du ikke en konto?</span>
            <button id="toggle-mode" type="button">Opret konto</button>
        </div>
        <div id="error-message" class="error-message"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
    // Check om det er et popup vindue
    if (window.opener === null || window.opener === window) {
        const width = 400;
        const height = 420;
        const left = (screen.width - width) / 2;
        const top = (screen.height - height) / 2;
        window.open(
            window.location.href,
            'loginPopup',
            `width=${width},height=${height},left=${left},top=${top},scrollbars=no,resizable=no`
        );
        window.close();
    }

    // Import Firebase modules
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAyh8ecigpscR8gPviU1qQxee5Rp1eeDqs",
        authDomain: "m6-database.firebaseapp.com",
        projectId: "m6-database",
        databaseURL: "https://m6-database.firebaseio.com",
        storageBucket: "m6-database.appspot.com",
        messagingSenderId: "172309206166",
        appId: "1:172309206166:web:c30fcffb805478abce9eb7",
        measurementId: "G-WZ7SVX56XP"
    };

    console.log('Firebase config loaded:', firebaseConfig);

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    console.log('Firebase app initialized:', { name: app.name, options: app.options });
    console.log('Firebase auth app config:', auth.app.options);

    const authForm = document.getElementById('auth-form');
    const submitBtn = document.getElementById('submit-btn');
    const toggleModeBtn = document.getElementById('toggle-mode');
    const toggleText = document.getElementById('toggle-text');
    const formTitle = document.getElementById('form-title');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const errorMessage = document.getElementById('error-message');

    let mode = 'login';

    function setMode(newMode) {
        mode = newMode;
        if (mode === 'signup') {
            formTitle.textContent = 'Opret konto';
            submitBtn.textContent = 'Opret konto';
            toggleText.textContent = 'Har du allerede en konto?';
            toggleModeBtn.textContent = 'Log ind';
            confirmPasswordInput.style.display = 'block';
            confirmPasswordInput.required = true;
            document.body.style.height = '100%';
        } else {
            formTitle.textContent = 'Log ind';
            submitBtn.textContent = 'Log ind';
            toggleText.textContent = 'Har du ikke en konto?';
            toggleModeBtn.textContent = 'Opret konto';
            confirmPasswordInput.style.display = 'none';
            confirmPasswordInput.required = false;
        }
        errorMessage.textContent = '';
    }

    toggleModeBtn.addEventListener('click', () => {
        setMode(mode === 'login' ? 'signup' : 'login');
    });

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = confirmPasswordInput.value;

        errorMessage.textContent = '';

        if (mode === 'signup' && password !== confirmPassword) {
            errorMessage.textContent = 'Adgangskoderne matcher ikke.';
            return;
        }

        try {
            let userCredential;

            if (mode === 'signup') {
                userCredential = await createUserWithEmailAndPassword(auth, email, password);
            } else {
                userCredential = await signInWithEmailAndPassword(auth, email, password);
            }

            const user = userCredential.user;
            const userData = {
                email: user.email,
                lastLoginAt: serverTimestamp()
            };

            if (mode === 'signup') {
                userData.createdAt = serverTimestamp();
            }

            await setDoc(doc(db, 'users', user.uid), userData, { merge: true });

            alert(mode === 'signup' ? 'Konto oprettet!' : 'Login successful!');
            window.close();
        } catch (error) {
            console.error('Authentication error:', error.code, error.message);
            if (mode === 'signup') {
                errorMessage.textContent = 'Oprettelse mislykkedes. Tjek email og adgangskode.';
            } else {
                errorMessage.textContent = 'Login fejlede. Tjek email og adgangskode.';
            }
        }
    });
</script>
</body>
</html>
